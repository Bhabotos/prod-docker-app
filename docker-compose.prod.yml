# Production overrides, applied on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the base (dev) file:
#   - fastapi runs from a pre-built registry image (no local build on the server)
#   - all services restart:always (dev uses unless-stopped)
#   - nginx publishes 80 + 443 and gets the SSL-capable config + certbot volumes
#   - pgadmin is bound to 127.0.0.1 only (see DEPLOYMENT.md for why)
#   - certbot service added for Let's Encrypt certificate issuance/renewal

services:
  postgres:
    restart: always

  redis:
    restart: always

  fastapi:
    image: ${FASTAPI_IMAGE}
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  pgadmin:
    restart: always
    # Port binding is already loopback-only in the base file — nothing to
    # override here. (Compose *appends* ports lists across files rather
    # than replacing them, so redeclaring it here would add a second,
    # duplicate binding instead of overriding the first.)

  certbot:
    image: certbot/certbot:latest
    container_name: prod-docker-app-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"
    networks:
      - backend

volumes:
  certbot_webroot:
  certbot_certs:

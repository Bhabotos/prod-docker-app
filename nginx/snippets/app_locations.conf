# Shared routing for the app, included inside a `server {}` block.
#
#   /api/*  -> FastAPI   (the /api prefix is stripped: /api/items -> /items)
#   /*      -> frontend  (static UI container)
#
# Upstreams are held in variables and resolved by Docker's embedded DNS
# (127.0.0.11) at REQUEST time. With a literal `proxy_pass http://fastapi:8000`
# nginx resolves the name once at startup and keeps the old container IP, so
# redeploying/recreating fastapi would cause 502s until nginx restarts. It also
# means nginx can start even when the app containers are down - important
# because this nginx also fronts other sites.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://fastapi:8000;
set $web_upstream http://frontend:8080;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Captured verbatim from the live server. n8n runs as its own compose project
# (/opt/n8n) attached to this stack's `prod-docker-app_backend` network.
#
# KNOWN FRAGILITY (left as-is on purpose): the literal `proxy_pass http://n8n:5678`
# is resolved at nginx startup, so if the n8n container doesn't exist when nginx
# (re)starts, nginx fails to boot and takes every site down. See DEPLOYMENT.md.
server {
    listen 80;
    server_name n8n.bhabotos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name n8n.bhabotos.com;

    ssl_certificate /etc/letsencrypt/live/n8n.bhabotos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.bhabotos.com/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Captured verbatim from the live server (previously hand-edited in
# nginx.prod.conf). Static site, mounted read-only from /opt/bhabotos-site/current.
server {
    listen 80;
    server_name bhabotos.com www.bhabotos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bhabotos.com www.bhabotos.com;

    ssl_certificate /etc/letsencrypt/live/bhabotos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhabotos.com/privkey.pem;

    root /var/www/bhabotos;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

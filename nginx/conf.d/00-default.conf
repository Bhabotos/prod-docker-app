# Catch-all for port 80: answers the container health probe and drops requests
# for hostnames we don't serve (e.g. scanners hitting the bare IP).
# The named sites below still get their own server blocks.
server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 444; }
}

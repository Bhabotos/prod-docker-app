# Every container logs to json-file with rotation, so logs can never fill the
# disk. Read them with: docker compose logs -f <service>
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-docker-app-postgres
    restart: unless-stopped
    # NOTE: deliberately NO `logging:` here. This database is shared with n8n
    # workflows, and any change to this service's definition makes Compose
    # recreate (restart) it. Docker's default json-file driver has no rotation;
    # add `logging: *default-logging` in a planned maintenance window.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: prod-docker-app-redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fastapi:
    build: ./app
    container_name: prod-docker-app-fastapi
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://redis:${REDIS_PORT}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    # The HEALTHCHECK command lives in app/Dockerfile; only the timing is
    # tightened here so deploys detect "healthy" in ~10s instead of ~30s.
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: prod-docker-app-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    # HEALTHCHECK is defined in frontend/Dockerfile.

  nginx:
    image: nginx:alpine
    container_name: prod-docker-app-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      fastapi:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: prod-docker-app-pgadmin
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      # Loopback-only: published Docker ports bypass ufw by default, so this
      # is bound to 127.0.0.1 rather than all interfaces. Reach it remotely
      # via an SSH tunnel (see DEPLOYMENT.md).
      - "127.0.0.1:${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:

name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag and lowercase owner
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase, but github.repository_owner
          # preserves the account's actual casing (e.g. "Bhabotos") — GitHub
          # Actions expressions have no built-in lower() function, so this
          # has to happen in a shell step.
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/prod-docker-app-fastapi:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/prod-docker-app-fastapi:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_USER }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "SERVER_HOST / SERVER_USER / SERVER_SSH_KEY secrets are not set yet."
            echo "Image was built and pushed to GHCR, but skipping the deploy step."
            echo "Add those three secrets in repo Settings > Secrets and variables > Actions to enable auto-deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/prod-docker-app
            export FASTAPI_IMAGE=ghcr.io/${{ needs.build-and-push.outputs.owner }}/prod-docker-app-fastapi:${{ needs.build-and-push.outputs.image_tag }}
            ./scripts/deploy.sh

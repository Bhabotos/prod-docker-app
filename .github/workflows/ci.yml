name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t prod-docker-app-fastapi:ci ./app

      - name: Create .env for CI
        run: |
          cat <<EOF > .env
          APP_NAME=prod-docker-app
          APP_ENV=ci
          LOG_LEVEL=INFO
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=ci_db
          POSTGRES_PORT=5432
          REDIS_PORT=6379
          PGADMIN_DEFAULT_EMAIL=ci@example.com
          PGADMIN_DEFAULT_PASSWORD=ci_password
          PGADMIN_PORT=5050
          NGINX_PORT=80
          EOF

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for stack to become healthy
        run: |
          set -e
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' prod-docker-app-nginx 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Stack is healthy"
              exit 0
            fi
            echo "Waiting for stack to become healthy (attempt $i)... status=$status"
            sleep 5
          done
          echo "Stack did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test API
        run: |
          set -eo pipefail
          curl -sf http://localhost/health

          RESP=$(curl -sf -X POST http://localhost/items \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test","description":"created by GitHub Actions"}')
          echo "$RESP"
          ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | grep -o '[0-9]*')

          curl -sf http://localhost/items/$ID

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost/items/$ID)
          if [ "$STATUS" != "204" ]; then
            echo "Expected 204 on delete, got $STATUS"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prod-docker-app · items</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Items</h1>
    <p class="muted">Frontend tier &rarr; <code>/api</code> (FastAPI) &rarr; PostgreSQL + Redis.
      API status: <span id="status">checking…</span></p>

    <form id="add-form">
      <input id="name" placeholder="Name" required maxlength="255">
      <input id="description" placeholder="Description (optional)" maxlength="1000">
      <button type="submit">Add</button>
    </form>

    <p id="error" role="alert" hidden></p>
    <ul id="items"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>

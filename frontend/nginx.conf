# Serves the static frontend. Unprivileged image => listens on 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything is same-origin: no inline scripts/styles, no third-party hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }
}

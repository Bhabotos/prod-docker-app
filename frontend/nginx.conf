# Serves the static frontend. Unprivileged image => listens on 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }
}
